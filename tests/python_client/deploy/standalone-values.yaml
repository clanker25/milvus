cluster:
  enabled: true
log:
  level: debug  
image:
  all:
    repository: milvusdb/milvus
    tag: master-latest
    pullPolicy: IfNotPresent

standalone:
  resources:
    limits:
      cpu: 8
      memory: 32Gi
    requests:
      cpu: 4
      memory: 7Gi

kafka:
  enabled: false
  name: kafka
  replicaCount: 2
  defaultReplicationFactor: 3

etcd:
  replicaCount: 4
  image:
    repository: milvusdb/etcd
    tag: 3.5.5-r2  
minio:
  mode: standalone
pulsar:
  enabled: false

extraConfigFiles:
  user.yaml: |+
    dataCoord:
      compaction:
        indexBasedCompaction: false
    indexCoord:
      scheduler:
        interval: 100        