# This is a sample to deploy a milvus cluster using pulsar with minimum cost of resources.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: rolling-update-test
  namespace: chaos-testing
  labels:
    app: milvus
spec:
  mode: cluster
  config:
    rootCoord:
      enableActiveStandby: false
    dataCoord:
      enableActiveStandby: false
    queryCoord:
      enableActiveStandby: true
    indexCoord:
      enableActiveStandby: true
    #    mixCoord:
    #      enableActiveStandby: true
    quotaAndLimits:
      enable: false
    log:
      level: debug
  components:
    enableRollingUpdate: false
    imageUpdateMode: rollingUpgrade
    image: milvusdb/milvus:2.2.0-20231021-1f972292
    disableMetric: true
    standalone:
      resources:
        requests:
          cpu: 3
          memory: 9Gi
        limits:
          cpu: 8
          memory: 16Gi
      replicas: 1
    rootCoord:
      replicas: 1
    dataCoord:
      replicas: 1
    indexCoord:
      replicas: 1
    queryCoord:
      replicas: 1
    proxy:
      replicas: 1
    dataNode:
      replicas: 3
    indexNode:
      replicas: 3
    queryNode:
      resources:
        requests:
          cpu: 2
          memory: 8Gi
        limits:
          cpu: 4
          memory: 32Gi
      replicas: 2
  dependencies:
    msgStreamType: kafka
    etcd:
      inCluster:
        deletionPolicy: Retain
        pvcDeletion: false
        values:
          replicaCount: 3
          metrics:
            enabled: true
            podMonitor:
              enabled: true
              namespace: chaos-testing
    kafka:
      inCluster:
        deletionPolicy: Retain
        pvcDeletion: false
        values:
          replicaCount: 3
          defaultReplicationFactor: 2
          metrics:
            kafka:
              enabled: true
              serviceMonitor:
                enabled: false
            jmx:
              enabled: true
    pulsar:
      inCluster:
        deletionPolicy: Retain
        pvcDeletion: false
        values:
          components:
            autorecovery: false
            functions: false
            toolset: true
            pulsar_manager: false
          monitoring:
            prometheus: false
            grafana: true
            node_exporter: true
            alert_manager: false
          proxy:
            replicaCount: 1
            resources:
              requests:
                cpu: 0.01
                memory: 256Mi
            configData:
              PULSAR_MEM: >
                -Xms256m -Xmx256m
              PULSAR_GC: >
                -XX:MaxDirectMemorySize=256m
          bookkeeper:
            replicaCount: 2
            resources:
              requests:
                cpu: 0.01
                memory: 256Mi
            configData:
              PULSAR_MEM: >
                -Xms256m
                -Xmx256m
                -XX:MaxDirectMemorySize=256m
              PULSAR_GC: >
                -Dio.netty.leakDetectionLevel=disabled
                -Dio.netty.recycler.linkCapacity=1024
                -XX:+UseG1GC -XX:MaxGCPauseMillis=10
                -XX:+ParallelRefProcEnabled
                -XX:+UnlockExperimentalVMOptions
                -XX:+DoEscapeAnalysis
                -XX:ParallelGCThreads=32
                -XX:ConcGCThreads=32
                -XX:G1NewSizePercent=50
                -XX:+DisableExplicitGC
                -XX:-ResizePLAB
                -XX:+ExitOnOutOfMemoryError
                -XX:+PerfDisableSharedMem
                -XX:+PrintGCDetails
          zookeeper:
            replicaCount: 1
            resources:
              requests:
                cpu: 0.01
                memory: 256Mi
            configData:
              PULSAR_MEM: >
                -Xms256m
                -Xmx256m
              PULSAR_GC: >
                -Dcom.sun.management.jmxremote
                -Djute.maxbuffer=10485760
                -XX:+ParallelRefProcEnabled
                -XX:+UnlockExperimentalVMOptions
                -XX:+DoEscapeAnalysis -XX:+DisableExplicitGC
                -XX:+PerfDisableSharedMem
                -Dzookeeper.forceSync=no
          broker:
            replicaCount: 1
            resources:
              requests:
                cpu: 0.01
                memory: 128Mi
            configData:
              PULSAR_MEM: >
                -Xms256m
                -Xmx256m
              PULSAR_GC: >
                -XX:MaxDirectMemorySize=256m
                -Dio.netty.leakDetectionLevel=disabled
                -Dio.netty.recycler.linkCapacity=1024
                -XX:+ParallelRefProcEnabled
                -XX:+UnlockExperimentalVMOptions
                -XX:+DoEscapeAnalysis
                -XX:ParallelGCThreads=32
                -XX:ConcGCThreads=32
                -XX:G1NewSizePercent=50
                -XX:+DisableExplicitGC
                -XX:-ResizePLAB
                -XX:+ExitOnOutOfMemoryError
    storage:
      type: Azure
      inCluster:
        deletionPolicy: Retain
        pvcDeletion: false
        values:
          mode: distributed