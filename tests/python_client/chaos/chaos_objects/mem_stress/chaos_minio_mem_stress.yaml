kind: StressChaos
apiVersion: chaos-mesh.org/v1alpha1
metadata:
  name: test-datanode-memory-stress
  namespace: chaos-testing
spec:
  selector:
    namespaces:
      - chaos-testing
    labelSelectors:
      release: milvus-chaos
      app: minio
  mode: one
  stressors:
    cpu:
      workers: 3
      load: 80
    memory:
      workers: 3
      size: 1024Mi
  duration: 5m