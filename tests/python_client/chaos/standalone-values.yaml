cluster:
  enabled: false

log:
  level: debug

image:
  all:
    repository: milvusdb/milvus
    tag: master-latest
    pullPolicy: Always
standalone:
  resources:
    limits:
      cpu: 8
      memory: 16Gi
    requests:
      cpu: 4
      memory: 7Gi
pulsarv3:
  enabled: false

pulsar:
  enabled: false

kafka:
  enabled: true
  name: kafka
  replicaCount: 3
  defaultReplicationFactor: 2

etcd:
  replicaCount: 3
  image:
    repository: milvusdb/etcd
    tag: 3.5.5-r2  
minio:
  mode: standalone
pulsar:
  enabled: true

extraConfigFiles:
  user.yaml: |+
    dataCoord:
      compaction:
        indexBasedCompaction: false
    indexCoord:
      scheduler:
        interval: 100        